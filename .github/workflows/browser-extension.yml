name: Browser extension
on:
  pull_request:
  push:
    branches: [main, feat/browser-extension]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test browser-extension/tests/*.test.mjs
      - run: python -m unittest discover -s tests -v
      - name: Install browser test dependency
        working-directory: browser-extension
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        working-directory: browser-extension
        run: npx playwright install --with-deps chromium
      - name: Check extension and real local executor in Chromium
        working-directory: browser-extension
        run: node tests/browser-smoke.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
