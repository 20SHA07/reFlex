name: Slack UI checks

on:
  push:
    branches: [main, feat/slack-interface]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Slack dependencies
        run: python -m pip install -r requirements-slack.txt
      - name: Require the real Slack SDK
        run: python -c "import slack_bolt; import slack_sdk"
      - name: Test handlers and Bolt dispatch
        run: python -m unittest discover -s tests -v
